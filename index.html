<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>古风小生文案变装器</title>
<style>
  :root {
    --paper: #ECEEF1;        /* 雾气留白（主背景，冷灰蓝白） */
    --paper-deep: #D5DBE0;   /* 略深雾蓝（次级背景） */
    --ink: #1E2330;          /* 墨色（主文字，近黑） */
    --ink-soft: #5A6473;     /* 浅墨（次文字，灰蓝） */
    --line: #C0C8D0;         /* 边线冷灰蓝 */
    --card: #F6F8FA;         /* 卡片白（比 paper 略亮） */
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: "Kaiti SC", "KaiTi", "STKaiti", "楷体", serif;
    background: var(--paper);
    color: var(--ink);
    min-height: 100vh;
    padding: calc(env(safe-area-inset-top) + 108px) 18px calc(env(safe-area-inset-bottom) + 30px);
    touch-action: manipulation;
  }
  .wrap {
    max-width: 680px;
    margin: 0 auto;
  }
  header {
    text-align: center;
    margin-bottom: 22px;
  }
  h1 {
    font-size: 28px;
    letter-spacing: 6px;
    color: var(--ink);
    font-weight: 700;
  }
  .sub {
    margin-top: 6px;
    font-size: 13px;
    color: var(--ink-soft);
    letter-spacing: 2px;
  }
  .seal {
    display: inline-block;
    width: 14px; height: 14px;
    border: 2px solid #3D5A80;
    border-radius: 3px;
    margin-right: 8px;
    vertical-align: 1px;
    position: relative;
  }
  .seal::after {
    content: "";
    position: absolute;
    inset: 3px;
    background: #3D5A80;
    border-radius: 1px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 16px;
    box-shadow: 0 2px 10px rgba(60, 70, 90, 0.08);
  }
  .label {
    font-size: 14px;
    font-weight: 700;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .label::before {
    content: "";
    width: 4px; height: 14px;
    background: #3D5A80;
    border-radius: 2px;
  }
  textarea {
    width: 100%;
    min-height: 130px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: #FAFCFD;
    padding: 12px;
    font-size: 15px;
    line-height: 1.8;
    color: var(--ink);
    resize: vertical;
    font-family: inherit;
    outline: none;
  }
  textarea:focus { border-color: #7E9BB8; }
  .range-wrap {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 4px 0 6px;
  }
  input[type=range] {
    flex: 1;
    -webkit-appearance: none;
    appearance: none;
    height: 6px;
    border-radius: 3px;
    background: linear-gradient(to right, #7B92A6 0%, #8E7C66 50%, #8B2E26 100%);
    outline: none;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 22px; height: 22px;
    border-radius: 50%;
    background: var(--card);
    border: 3px solid #3D5A80;
    cursor: pointer;
  }
  input[type=range]::-moz-range-thumb {
    width: 18px; height: 18px;
    border-radius: 50%;
    background: var(--card);
    border: 3px solid #3D5A80;
    cursor: pointer;
  }
  .level-tag {
    flex-shrink: 0;
    font-size: 13px;
    padding: 3px 12px;
    border-radius: 20px;
    color: var(--card);
    min-width: 56px;
    text-align: center;
    font-weight: 700;
  }
  .lv-light { background: #7E9BB8; }
  .lv-mid { background: #5E7690; }
  .lv-heavy { background: #3D5A80; }
  .lv-full { background: #2A3F56; }
  .range-hint {
    font-size: 11px;
    color: var(--ink-soft);
    text-align: right;
    margin-top: 2px;
  }
  /* 文风选择 */
  .style-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin: 12px 0 8px;
  }
  .style-chip {
    border: 2px solid var(--line);
    border-radius: 12px;
    padding: 10px 6px;
    text-align: center;
    cursor: pointer;
    transition: all .15s;
    background: var(--card);
  }
  .style-chip:hover { border-color: #7E9BB8; }
  .style-chip.active {
    border-color: #3D5A80;
    background: #EBF0F7;
    box-shadow: 0 2px 8px rgba(61,90,128,.15);
  }
  .style-icon { font-size: 22px; display: block; margin-bottom: 4px; }
  .style-name { font-size: 13px; font-weight: 700; color: var(--ink); }
  .style-desc { font-size: 10px; color: var(--ink-soft); margin-top: 2px; }
  .btn-row {
    display: flex;
    gap: 10px;
    margin-top: 14px;
  }
  .btn {
    flex: 1;
    border: none;
    border-radius: 10px;
    padding: 13px 0;
    font-size: 16px;
    font-weight: 700;
    font-family: inherit;
    letter-spacing: 3px;
    cursor: pointer;
    touch-action: manipulation;
  }
  .btn-primary {
    background: #3D5A80;
    color: #F5F7FA;
    box-shadow: 0 3px 8px rgba(61, 90, 128, 0.35);
  }
  .btn-ghost {
    background: var(--paper-deep);
    color: var(--ink);
    border: 1px solid var(--line);
  }
  .btn:active { transform: scale(0.97); }
  #outputBox {
    white-space: pre-wrap;
    font-size: 15px;
    line-height: 2;
    min-height: 90px;
    max-height: 420px;
    overflow-y: auto;
    background: #FAFCFD;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px;
    display: none;
  }
  #outputBox.show { display: block; }
  .op-row {
    display: flex;
    gap: 10px;
    margin-top: 12px;
    flex-wrap: wrap;
  }
  .chip {
    flex: 1;
    min-width: 90px;
    border: 1px solid var(--line);
    background: var(--paper);
    color: var(--ink);
    border-radius: 8px;
    padding: 9px 0;
    font-size: 14px;
    font-family: inherit;
    cursor: pointer;
    touch-action: manipulation;
  }
  .chip:active { background: var(--paper-deep); }
  #imgCard {
    display: none;
    margin-top: 12px;
    text-align: center;
  }
  #imgCard.show { display: block; }
  #imgCard canvas {
    max-width: 100%;
    border-radius: 10px;
    border: 1px solid var(--line);
    box-shadow: 0 4px 16px rgba(60, 70, 90, 0.18);
  }
  #imgCard .save-tip {
    font-size: 12px;
    color: var(--ink-soft);
    margin-top: 8px;
    line-height: 1.6;
  }
  footer {
    text-align: center;
    font-size: 11px;
    color: var(--ink-soft);
    margin-top: 20px;
    line-height: 1.8;
  }
  .toast {
    position: fixed;
    left: 50%;
    bottom: calc(env(safe-area-inset-bottom) + 60px);
    transform: translateX(-50%);
    background: rgba(30, 35, 48, 0.92);
    color: #FFF8EC;
    padding: 10px 18px;
    border-radius: 8px;
    font-size: 13px;
    z-index: 99;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
    max-width: 80vw;
    text-align: center;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; }
  .hidden-input {
    position: absolute;
    opacity: 0;
    pointer-events: none;
    height: 0;
  }
</style>
</head>
<body>
<div class="wrap">

<header>
  <h1><span class="seal"></span>古风小生文案变装器</h1>
  <div class="sub">把大白话，说成半文不白的文言</div>
</header>

<div class="card">
  <div class="label">你的文案</div>
  <textarea id="inputText" placeholder="在此粘贴你要变装的大白话文案……&#10;例：今天上班摸鱼被老板抓到了，我尴尬死了，同事都笑我，我真的会谢！"></textarea>
  <div class="range-wrap">
    <input type="range" id="levelSlider" min="0" max="200" value="60">
    <span class="level-tag lv-mid" id="levelTag">中·半白</span>
  </div>
  <div class="range-hint">文白越偏古，腔调越正（浅=只换词 · 中=换词改口 · 文=地名转古称 + 文言起结 · 全=纯文言重构）</div>
  <div class="label" style="margin-top:18px">小生风格</div>
  <div class="style-grid">
    <div class="style-chip active" data-style="scholar" data-icon="🎓">
      <span class="style-icon">🎓</span>
      <div class="style-name">温润如玉</div>
      <div class="style-desc">清雅温润，书卷气浓</div>
    </div>
    <div class="style-chip" data-style="roguish" data-icon="🍶">
      <span class="style-icon">🍶</span>
      <div class="style-name">狂放不羁</div>
      <div class="style-desc">豪放洒脱，落拓不群</div>
    </div>
    <div class="style-chip" data-style="melancholy" data-icon="🌙">
      <span class="style-icon">🌙</span>
      <div class="style-name">清冷孤傲</div>
      <div class="style-desc">孤高自许，淡雅疏离</div>
    </div>
    <div class="style-chip" data-style="romantic" data-icon="🌸">
      <span class="style-icon">🌸</span>
      <div class="style-name">缠绵悱恻</div>
      <div class="style-desc">情之所钟，缠绵深婉</div>
    </div>
    <div class="style-chip" data-style="humorous" data-icon="😏">
      <span class="style-icon">😏</span>
      <div class="style-name">诙谐打油</div>
      <div class="style-desc">俏皮打趣，雅俗共赏</div>
    </div>
    <div class="style-chip" data-style="zen" data-icon="🍵">
      <span class="style-icon">🍵</span>
      <div class="style-name">禅意淡然</div>
      <div class="style-desc">放下执念，随缘自在</div>
    </div>
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="goBtn">变 装</button>
  </div>
</div>

<div class="card">
  <div class="label">小生出品</div>
  <div id="outputBox"></div>
  <div class="op-row">
    <button class="chip" id="againBtn">再转一次</button>
    <button class="chip" id="copyBtn">复制文案</button>
    <button class="chip" id="imgBtn">生成分享图</button>
  </div>
  <div id="imgCard">
    <canvas id="shareCanvas"></canvas>
    <div class="save-tip" id="saveTip">长按图片即可保存，发小红书配图刚刚好。</div>
  </div>
</div>

<footer>
  本工具纯前端离线运行，词库源于网络流行语对照整理，仅供娱乐玩梗。<br>
  半文不白，风味独特；较真你就输了。
</footer>
</div>

<div class="toast" id="toast"></div>
<textarea class="hidden-input" id="copyHelper"></textarea>

<script src="./app.js"></script>
</body>
</html>
